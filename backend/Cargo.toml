[package]
name = "sdh-ludusavi-backend"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
decky-plugin = { git = "https://github.com/beallio/decky-loader", rev = "98bce11fffffa59a331098edd8671591fb98a9a5", package = "decky-plugin" }
libc = "0.2"
log = "0.4"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-casefold = "0.2"
zip = { version = "0.6.6", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
