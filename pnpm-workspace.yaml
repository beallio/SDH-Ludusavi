minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Pinned exclusions only: each entry names the exact version audited by hand,
  # so the 14-day quarantine still applies to every other release of these
  # packages. GHSA-2v37-7h3g-55p8 was first published as fixed in 3.3.17, then
  # the advisory range was widened to <3.3.18; nanoid 3.3.18 (published
  # 2026-08-07) is the real fix and clears the quarantine on its own on
  # 2026-08-21. Until then this pin is what keeps the audit gate green without
  # suppressing the advisory.
  - postcss@8.5.23
  - nanoid@3.3.18
storeDir: /tmp/sdh_ludusavi/.pnpm-store
virtualStoreDir: /tmp/sdh_ludusavi/pnpm-virtual-store
sideEffectsCache: false

packages:
  - .

overrides:
  brace-expansion@^1.1.7: 1.1.16
  brace-expansion@^2.0.0: 2.1.2
  minimatch@^3.0.0: 3.1.5
  minimatch@^9.0.0: 9.0.9
  picomatch@^2.0.0: 2.3.2
  picomatch@^4.0.0: 4.0.4
  # GHSA-r28c-9q8g-f849 (path traversal) was patched in 8.5.18;
  # GHSA-fxqj-rqcc-2cmp (arbitrary .map read via sourceMappingURL) in 8.5.23.
  postcss@<=8.5.22: 8.5.23
  # GHSA-mwcw-c2x4-8c55 (negative size loops) patched in 3.3.16;
  # GHSA-2v37-7h3g-55p8 (custom generators loop) in 3.3.18 — the advisory
  # originally named 3.3.17 and was later widened to <3.3.18.
  nanoid@<3.3.18: 3.3.18
  # GHSA-mh99-v99m-4gvg reaches brace-expansion only through these two build
  # tools. Forcing both to current majors drops the legacy glob/minimatch
  # chains that pin the vulnerable brace-expansion builds.
  "@rollup/plugin-commonjs@^26.0.0": 29.0.3
  rollup-plugin-delete@^2.0.0: 3.0.2
