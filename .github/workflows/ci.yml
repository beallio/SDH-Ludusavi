name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-gate:
    name: Full CI Gate and Dry-Run Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Provision user systemd manager and bus
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          for _ in $(seq 1 30); do
            [[ -S "/run/user/${uid}/bus" ]] && break
            sleep 1
          done
          [[ -S "/run/user/${uid}/bus" ]] || {
            echo "user systemd bus did not start for uid ${uid}" >&2
            exit 1
          }
          {
            echo "XDG_RUNTIME_DIR=/run/user/${uid}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus"
          } >> "$GITHUB_ENV"

      - name: Probe user systemd scope and cgroup freezer
        run: |
          set -euo pipefail
          [[ -f /sys/fs/cgroup/cgroup.controllers ]] || {
            echo "cgroup v2 is unavailable" >&2
            exit 1
          }
          uid="$(id -u)"
          unit="app-steam-app987654-$(date +%s%N).scope"
          pid_file="$RUNNER_TEMP/contract-scope.pid"
          scope_dir="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service/app.slice/${unit}"
          systemd-run --user --scope --slice=app.slice --unit="$unit" --quiet -- \
            /usr/bin/bash -c 'printf "%s\n" "$$" > "$1"; exec sleep 60' bash "$pid_file" &
          scope_client=$!
          cleanup() {
            if [[ -f "$scope_dir/cgroup.freeze" ]]; then
              printf '0\n' > "$scope_dir/cgroup.freeze" || true
            fi
            if [[ -s "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
            kill "$scope_client" 2>/dev/null || true
            wait "$scope_client" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            [[ -s "$pid_file" ]] && break
            if ! kill -0 "$scope_client" 2>/dev/null; then
              wait "$scope_client" || true
              echo "systemd-run could not create the user scope" >&2
              exit 1
            fi
            sleep 0.1
          done
          [[ -s "$pid_file" ]] || {
            echo "systemd-run did not start the scope probe process" >&2
            exit 1
          }
          [[ -w "$scope_dir/cgroup.freeze" && -r "$scope_dir/cgroup.events" ]] || {
            echo "user scope does not expose writable cgroup-v2 freezer controls: $scope_dir" >&2
            exit 1
          }
          printf '1\n' > "$scope_dir/cgroup.freeze"
          for _ in $(seq 1 100); do
            grep -q '^frozen 1$' "$scope_dir/cgroup.events" && break
            sleep 0.1
          done
          grep -q '^frozen 1$' "$scope_dir/cgroup.events" || {
            echo "user scope freezer failed to freeze the probe process" >&2
            exit 1
          }
          printf '0\n' > "$scope_dir/cgroup.freeze"
          for _ in $(seq 1 100); do
            grep -q '^frozen 0$' "$scope_dir/cgroup.events" && break
            sleep 0.1
          done
          grep -q '^frozen 0$' "$scope_dir/cgroup.events" || {
            echo "user scope freezer failed to thaw the probe process" >&2
            exit 1
          }

      - name: Prepare Virtual Environment and Sync Dependencies
        run: |
          PKG_VER=$(jq -r .version package.json)
          SETUPTOOLS_SCM_PRETEND_VERSION="$PKG_VER" ./run.sh uv sync

      - name: Run Quality Gates
        run: |
          ./run.sh bash scripts/quality_gates.sh check

      - name: Build Dry-Run Package
        run: |
          PKG_VER=$(jq -r .version package.json)
          ./run.sh uv run python scripts/package_plugin.py --release --release-version "$PKG_VER" --versioned-output --emit-release-metadata --output-dir out

      - name: Validate Dry-Run Package ZIP
        run: |
          PKG_VER=$(jq -r .version package.json)
          ./run.sh uv run python scripts/validate_plugin_zip.py out/SDH-Ludusavi-v$PKG_VER.zip --expected-version "$PKG_VER" --expected-name SDH-Ludusavi
          (cd out && sha256sum -c "SDH-Ludusavi-v$PKG_VER.zip.sha256")

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-artifacts
          path: out/
  contract-real-ludusavi:
    name: Real Ludusavi Backend Contract
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Prepare Virtual Environment and Sync Dependencies
        run: |
          PKG_VER=$(jq -r .version package.json)
          SETUPTOOLS_SCM_PRETEND_VERSION="$PKG_VER" ./run.sh uv sync

      - name: Install Ludusavi Runtime Libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64

      - name: Download and Verify Ludusavi v0.31.0
        env:
          LUDUSAVI_SHA256: 7322ff45d41eae7ae064a80d8c9ecccc5b8fb6fc090a603a66369cd4b054068d
        run: |
          mkdir -p "$RUNNER_TEMP/ludusavi"
          curl -fsSL "https://github.com/mtkennerly/ludusavi/releases/download/v0.31.0/ludusavi-v0.31.0-linux.tar.gz" \
            -o "$RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz"
          echo "$LUDUSAVI_SHA256  $RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz" -C "$RUNNER_TEMP/ludusavi"
          echo "SDH_CONTRACT_LUDUSAVI_BIN=$RUNNER_TEMP/ludusavi/ludusavi" >> "$GITHUB_ENV"
          echo "SDH_CONTRACT_REQUIRE_REAL=1" >> "$GITHUB_ENV"

      - name: Run Real Ludusavi Contract
        run: |
          ./run.sh uv run pytest -o addopts='' tests/contract/test_contract.py -m real_ludusavi
  rust-backend:
    name: Native Rust Backend and Core Contract
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl Linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Prepare Virtual Environment and Sync Dependencies
        run: |
          PKG_VER=$(jq -r .version package.json)
          SETUPTOOLS_SCM_PRETEND_VERSION="$PKG_VER" ./run.sh uv sync

      - name: Install Ludusavi Runtime Libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64

      - name: Download and Verify Ludusavi v0.31.0
        env:
          LUDUSAVI_SHA256: 7322ff45d41eae7ae064a80d8c9ecccc5b8fb6fc090a603a66369cd4b054068d
        run: |
          mkdir -p "$RUNNER_TEMP/ludusavi"
          curl -fsSL "https://github.com/mtkennerly/ludusavi/releases/download/v0.31.0/ludusavi-v0.31.0-linux.tar.gz" \
            -o "$RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz"
          echo "$LUDUSAVI_SHA256  $RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ludusavi-v0.31.0-linux.tar.gz" -C "$RUNNER_TEMP/ludusavi"
          echo "SDH_CONTRACT_LUDUSAVI_BIN=$RUNNER_TEMP/ludusavi/ludusavi" >> "$GITHUB_ENV"
          echo "SDH_CONTRACT_REQUIRE_REAL=1" >> "$GITHUB_ENV"
      - name: Run Rust Gates
        working-directory: backend
        run: |
          ../run.sh cargo fmt --manifest-path Cargo.toml --check
          ../run.sh cargo clippy --manifest-path Cargo.toml --all-targets --locked -- -D warnings
          ../run.sh cargo test --manifest-path Cargo.toml --locked

      - name: Build SteamOS Backend
        working-directory: backend
        run: ../run.sh cargo build --manifest-path Cargo.toml --release --locked --target x86_64-unknown-linux-musl

      - name: Run Native Backend RPC Contracts
        run: |
          SDH_CONTRACT_BACKEND=/var/tmp/sdh_ludusavi/cargo-target/x86_64-unknown-linux-musl/release/backend \
            ./run.sh uv run pytest -o addopts='' tests/contract/
