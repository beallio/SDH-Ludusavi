[project]
name = "SDH-ludusavi"
dynamic = ["version"]
description = "Decky Loader plugin for Ludusavi save backup and restore controls"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "David Beall", email = "6121439+beallio@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["decky", "ludusavi", "steam-deck", "backup", "saves"]
dependencies = []

[project.urls]
Homepage = "https://github.com/beallio/SDH-Ludusavi"
Repository = "https://github.com/beallio/SDH-Ludusavi"
Issues = "https://github.com/beallio/SDH-Ludusavi/issues"


[tool.uv]
cache-dir = "/tmp/sdh_ludusavi/.uv_cache"
package = false

[tool.ruff]
line-length = 100
cache-dir = "/tmp/sdh_ludusavi/.ruff_cache"
extend-exclude = ["main.py"]

[tool.pytest.ini_options]
cache_dir = "/tmp/sdh_ludusavi/.pytest_cache"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_ludusavi: exercises the pinned Ludusavi CLI binary",
    "contract_core: exercises RPCs ported to the Rust backend",
    "contract_operations: exercises backup and restore operations",
    "contract_lifecycle: exercises automatic game lifecycle",
    "contract_gate: exercises launch gate behavior",
    "contract_syncthing: exercises Syncthing integration",
    "contract_updater: exercises plugin updates",
    "contract_theme: exercises status theme integration",
]

[tool.coverage.run]
data_file = "/tmp/sdh_ludusavi/.coverage"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.24",
]
